<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Impressions but no clicks: which problem do you actually have?</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Plot your page using two GSC signals: average position, and click count</text>

  <!-- Axes -->
  <line x1="120" y1="480" x2="700" y2="480" stroke="#9ca3af" stroke-width="2"/>
  <line x1="120" y1="480" x2="120" y2="100" stroke="#9ca3af" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="410" y="515" text-anchor="middle" font-size="14" fill="#374151">Average position (GSC) →</text>
  <text x="60" y="290" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 60 290)">Clicks received →</text>

  <!-- Axis tick labels -->
  <text x="120" y="500" text-anchor="middle" font-size="12" fill="#9ca3af">#1-10</text>
  <text x="410" y="500" text-anchor="middle" font-size="12" fill="#9ca3af">#11-30</text>
  <text x="690" y="500" text-anchor="middle" font-size="12" fill="#9ca3af">#30+</text>

  <!-- Quadrant divider -->
  <line x1="410" y1="100" x2="410" y2="480" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="290" x2="700" y2="290" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Quadrant: top-left = good position, has clicks = healthy -->
  <rect x="120" y="100" width="290" height="190" fill="#ecfdf5"/>
  <text x="265" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Healthy</text>
  <text x="265" y="148" text-anchor="middle" font-size="11" fill="#047857">Good position + getting clicks</text>
  <text x="265" y="164" text-anchor="middle" font-size="11" fill="#047857">Nothing to diagnose here</text>

  <!-- Quadrant: top-right = bad position, has clicks (rare, reverse-selection) -->
  <rect x="410" y="100" width="290" height="190" fill="#eff6ff"/>
  <text x="555" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Reverse-selection clicks</text>
  <text x="555" y="148" text-anchor="middle" font-size="11" fill="#1d4ed8">Buried position, but someone</text>
  <text x="555" y="164" text-anchor="middle" font-size="11" fill="#1d4ed8">clicked anyway — a strong</text>
  <text x="555" y="180" text-anchor="middle" font-size="11" fill="#1d4ed8">positive signal, rare and valuable</text>

  <!-- Quadrant: bottom-left = good position, zero clicks = CTR problem -->
  <rect x="120" y="290" width="290" height="190" fill="#fef2f2"/>
  <text x="265" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">CTR PROBLEM</text>
  <text x="265" y="340" text-anchor="middle" font-size="11" fill="#b91c1c">e.g. compress-to-100kb</text>
  <text x="265" y="356" text-anchor="middle" font-size="11" fill="#b91c1c">pos. 6.1, 5,954 impressions, 2 clicks</text>
  <text x="265" y="378" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">Fix: title / description</text>

  <!-- Quadrant: bottom-right = bad position, zero clicks = ranking problem -->
  <rect x="410" y="290" width="290" height="190" fill="#fffbeb"/>
  <text x="555" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">RANKING PROBLEM</text>
  <text x="555" y="340" text-anchor="middle" font-size="11" fill="#b45309">e.g. split-image</text>
  <text x="555" y="356" text-anchor="middle" font-size="11" fill="#b45309">pos. 51.37, 116 impressions, 3 clicks</text>
  <text x="555" y="378" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">Fix: nothing yet — not visible to users</text>

  <!-- Markers for the two cases -->
  <circle cx="200" cy="460" r="7" fill="#dc2626"/>
  <text x="200" y="445" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">compress-to-100kb</text>

  <circle cx="640" cy="465" r="7" fill="#d97706"/>
  <text x="640" y="445" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">split-image</text>

  <!-- Footer note -->
  <text x="400" y="545" text-anchor="middle" font-size="11" fill="#9ca3af">Diagnose first, then act — the fix for each quadrant is the opposite of the other</text>
</svg>
