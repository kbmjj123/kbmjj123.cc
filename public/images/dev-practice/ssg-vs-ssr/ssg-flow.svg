<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Inter', -apple-system, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#13131e"/>
    </linearGradient>
    <!-- Green glow -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <!-- Gold glow -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Node bg -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#13131e"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#2a2a42" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)"/>
  <rect width="800" height="420" fill="url(#dots)"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#e8edf5" font-size="16" font-weight="700" letter-spacing="1">SSG — Static Site Generation</text>
  <text x="400" y="62" text-anchor="middle" fill="#4d5a7a" font-size="11">Build time → CDN → Browser</text>

  <!-- ═══ Node: User ═══ -->
  <g filter="url(#shadow)">
    <rect x="30" y="150" width="120" height="70" rx="8" fill="url(#nodeBg)" stroke="#2a2a42" stroke-width="1.5"/>
    <rect x="30" y="150" width="120" height="70" rx="8" fill="none" stroke="#4ade80" stroke-width="0.5" opacity="0.3"/>
    <!-- Browser icon -->
    <rect x="52" y="166" width="28" height="20" rx="3" fill="none" stroke="#4ade80" stroke-width="1.2"/>
    <line x1="52" y1="173" x2="80" y2="173" stroke="#4ade80" stroke-width="0.8" opacity="0.6"/>
    <circle cx="57" cy="170" r="1.5" fill="#f87171"/>
    <circle cx="63" cy="170" r="1.5" fill="#fbbf24"/>
    <circle cx="69" cy="170" r="1.5" fill="#4ade80"/>
    <text x="90" y="180" fill="#e8edf5" font-size="11" font-weight="600">User</text>
    <text x="90" y="195" fill="#4d5a7a" font-size="9">Browser</text>
  </g>

  <!-- ═══ Arrow: User → CDN ═══ -->
  <line x1="150" y1="185" x2="250" y2="185" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)" opacity="0.8"/>
  <text x="200" y="177" text-anchor="middle" fill="#4d5a7a" font-size="8">GET /page</text>

  <!-- ═══ Node: CDN ═══ -->
  <g filter="url(#shadow)">
    <rect x="250" y="140" width="140" height="90" rx="8" fill="url(#nodeBg)" stroke="#2a2a42" stroke-width="1.5"/>
    <!-- CDN icon — globe -->
    <circle cx="295" cy="175" r="16" fill="none" stroke="#4ade80" stroke-width="1.2"/>
    <ellipse cx="295" cy="175" rx="8" ry="16" fill="none" stroke="#4ade80" stroke-width="0.8" opacity="0.6"/>
    <line x1="279" y1="175" x2="311" y2="175" stroke="#4ade80" stroke-width="0.8" opacity="0.6"/>
    <line x1="295" y1="159" x2="295" y2="191" stroke="#4ade80" stroke-width="0.6" opacity="0.4"/>
    <text x="320" y="172" fill="#e8edf5" font-size="11" font-weight="600">CDN</text>
    <text x="320" y="185" fill="#4d5a7a" font-size="9">Edge Node</text>
    <text x="295" y="218" text-anchor="middle" fill="#4ade80" font-size="8" opacity="0.7">~0ms latency</text>
  </g>

  <!-- ═══ Arrow: CDN → HTML ═══ -->
  <line x1="390" y1="185" x2="490" y2="185" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)" opacity="0.8"/>
  <text x="440" y="177" text-anchor="middle" fill="#4d5a7a" font-size="8">cache hit</text>

  <!-- ═══ Node: Static HTML ═══ -->
  <g filter="url(#shadow)">
    <rect x="490" y="140" width="140" height="90" rx="8" fill="url(#nodeBg)" stroke="#2a2a42" stroke-width="1.5"/>
    <!-- File icon -->
    <rect x="512" y="160" width="22" height="28" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <polyline points="512,160 526,160 534,168" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <line x1="518" y1="173" x2="528" y2="173" stroke="#fbbf24" stroke-width="0.6" opacity="0.6"/>
    <line x1="518" y1="178" x2="528" y2="178" stroke="#fbbf24" stroke-width="0.6" opacity="0.6"/>
    <line x1="518" y1="183" x2="524" y2="183" stroke="#fbbf24" stroke-width="0.6" opacity="0.6"/>
    <text x="545" y="172" fill="#e8edf5" font-size="11" font-weight="600">Static</text>
    <text x="545" y="185" fill="#4d5a7a" font-size="9">HTML files</text>
    <text x="560" y="218" text-anchor="middle" fill="#fbbf24" font-size="8" opacity="0.7">pre-built</text>
  </g>

  <!-- ═══ Build Phase (bottom) ═══ -->
  <g opacity="0.9">
    <rect x="200" y="290" width="400" height="100" rx="8" fill="url(#nodeBg)" stroke="#2a2a42" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="400" y="312" text-anchor="middle" fill="#4d5a7a" font-size="9" letter-spacing="2">BUILD TIME (CI / CLOUDFLARE PAGES)</text>

    <!-- Build node 1 -->
    <rect x="220" y="325" width="100" height="45" rx="6" fill="#13131e" stroke="#2a2a42" stroke-width="1"/>
    <text x="270" y="345" text-anchor="middle" fill="#e8edf5" font-size="10">nuxt generate</text>
    <text x="270" y="360" text-anchor="middle" fill="#4d5a7a" font-size="8">render all routes</text>

    <!-- Arrow -->
    <line x1="320" y1="348" x2="360" y2="348" stroke="#4d5a7a" stroke-width="1" marker-end="url(#arrowGold)" opacity="0.5"/>

    <!-- Build node 2 -->
    <rect x="370" y="325" width="100" height="45" rx="6" fill="#13131e" stroke="#2a2a42" stroke-width="1"/>
    <text x="420" y="345" text-anchor="middle" fill="#e8edf5" font-size="10">.output/public</text>
    <text x="420" y="360" text-anchor="middle" fill="#4d5a7a" font-size="8">HTML + assets</text>

    <!-- Arrow -->
    <line x1="470" y1="348" x2="510" y2="348" stroke="#4d5a7a" stroke-width="1" marker-end="url(#arrowGold)" opacity="0.5"/>

    <!-- Build node 3 -->
    <rect x="520" y="325" width="60" height="45" rx="6" fill="#13131e" stroke="#2a2a42" stroke-width="1"/>
    <text x="550" y="345" text-anchor="middle" fill="#4ade80" font-size="10">deploy</text>
    <text x="550" y="360" text-anchor="middle" fill="#4d5a7a" font-size="8">push to CDN</text>
  </g>

  <!-- Arrow: build → CDN (upward) -->
  <line x1="400" y1="290" x2="320" y2="235" stroke="#4ade80" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="340" y="265" fill="#4ade80" font-size="8" opacity="0.6">uploaded</text>

  <!-- ═══ Phase label ═══ -->
  <rect x="30" y="90" width="90" height="24" rx="4" fill="#4ade80" opacity="0.1"/>
  <text x="75" y="106" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">REQUEST</text>

  <rect x="200" y="268" width="70" height="20" rx="4" fill="#fbbf24" opacity="0.1"/>
  <text x="235" y="282" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">BUILD</text>

  <!-- ═══ Legend ═══ -->
  <g transform="translate(640, 90)">
    <rect width="140" height="60" rx="6" fill="#13131e" stroke="#2a2a42" stroke-width="1" opacity="0.8"/>
    <circle cx="16" cy="20" r="4" fill="#4ade80"/>
    <text x="28" y="24" fill="#9aa8c9" font-size="9">Request flow</text>
    <circle cx="16" cy="40" r="4" fill="#fbbf24"/>
    <text x="28" y="44" fill="#9aa8c9" font-size="9">Build flow</text>
  </g>
</svg>