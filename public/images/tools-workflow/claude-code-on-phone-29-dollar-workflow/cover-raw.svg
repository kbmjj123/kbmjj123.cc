<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1424 800" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1424" height="800" fill="#0b0b12"/>
  <rect x="0" y="0" width="1424" height="6" fill="#4ade80"/>

  <!-- Title -->
  <text x="120" y="150" fill="#e8edf5" font-size="72" font-weight="700" letter-spacing="-1.5">Claude Code on My Phone</text>
  <text x="120" y="212" fill="#9aa8c9" font-size="32" font-weight="400">Tailscale + Cockpit, running a real CLI from a phone browser</text>

  <text x="120" y="330" fill="#4d5a7a" font-size="20" font-weight="500" letter-spacing="3">CONNECTION CHAIN</text>

  <!-- ===== Node 1: Phone ===== -->
  <rect x="107" y="380" width="250" height="150" rx="14" fill="#13131e" stroke="#4ade80" stroke-width="3"/>
  <g stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="218" y="404" width="28" height="48" rx="5"/>
    <line x1="227" y1="444" x2="237" y2="444"/>
  </g>
  <text x="232" y="490" text-anchor="middle" fill="#e8edf5" font-size="27" font-weight="600">Phone</text>
  <text x="232" y="516" text-anchor="middle" fill="#9aa8c9" font-size="18">Browser</text>

  <!-- Arrow 1 -->
  <line x1="365" y1="455" x2="420" y2="455" stroke="#4ade80" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="392" y="440" text-anchor="middle" fill="#4d5a7a" font-size="16">HTTPS</text>

  <!-- ===== Node 2: Tailscale (lock) ===== -->
  <rect x="427" y="380" width="250" height="150" rx="14" fill="#13131e" stroke="#60a5fa" stroke-width="3"/>
  <g stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="536" y="424" width="32" height="26" rx="4"/>
    <path d="M 544 424 v -8 a 8 8 0 0 1 16 0 v 8"/>
  </g>
  <text x="552" y="490" text-anchor="middle" fill="#e8edf5" font-size="27" font-weight="600">Tailscale</text>
  <text x="552" y="516" text-anchor="middle" fill="#9aa8c9" font-size="18">Mesh VPN</text>

  <!-- Arrow 2 -->
  <line x1="685" y1="455" x2="740" y2="455" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="712" y="440" text-anchor="middle" fill="#4d5a7a" font-size="16">LAN</text>

  <!-- ===== Node 3: Cockpit (monitor) ===== -->
  <rect x="747" y="380" width="250" height="150" rx="14" fill="#13131e" stroke="#fbbf24" stroke-width="3"/>
  <g stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="852" y="404" width="40" height="28" rx="3"/>
    <line x1="872" y1="432" x2="872" y2="442"/>
    <line x1="860" y1="442" x2="884" y2="442"/>
  </g>
  <text x="872" y="490" text-anchor="middle" fill="#e8edf5" font-size="27" font-weight="600">Cockpit</text>
  <text x="872" y="516" text-anchor="middle" fill="#9aa8c9" font-size="18">Web Terminal</text>

  <!-- Arrow 3 -->
  <line x1="1005" y1="455" x2="1060" y2="455" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-gold)"/>
  <text x="1032" y="440" text-anchor="middle" fill="#4d5a7a" font-size="16">Shell</text>

  <!-- ===== Node 4: Claude Code (terminal prompt) ===== -->
  <rect x="1067" y="380" width="250" height="150" rx="14" fill="#13131e" stroke="#4ade80" stroke-width="3"/>
  <g stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1172" y="404" width="40" height="32" rx="4"/>
    <path d="M 1180 414 l 7 6 l -7 6"/>
    <line x1="1194" y1="426" x2="1204" y2="426"/>
  </g>
  <text x="1192" y="490" text-anchor="middle" fill="#e8edf5" font-size="27" font-weight="600">Claude Code</text>
  <text x="1192" y="516" text-anchor="middle" fill="#9aa8c9" font-size="18">CLI</text>

  <!-- Cost badge -->
  <g transform="translate(120, 640)">
    <rect x="0" y="0" width="368" height="96" rx="48" fill="#13131e" stroke="#4ade80" stroke-width="3"/>
    <text x="46" y="62" fill="#4ade80" font-size="46" font-weight="700">$29</text>
    <text x="168" y="50" fill="#e8edf5" font-size="24" font-weight="600">/ month</text>
    <text x="168" y="78" fill="#9aa8c9" font-size="17">total, all-in</text>
  </g>

  <!-- Corner note -->
  <text x="1304" y="682" text-anchor="end" fill="#4d5a7a" font-size="20">kbmjj123.cc</text>
  <text x="1304" y="712" text-anchor="end" fill="#4d5a7a" font-size="17">Fragmented time, real work</text>
</svg>
