<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, -apple-system, sans-serif" font-size="14">
  <!-- Background -->
  <rect width="800" height="300" fill="#0b0b12" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e8edf5" font-size="16" font-weight="600">Connection Chain</text>

  <!-- Nodes -->
  <!-- Phone -->
  <rect x="30" y="100" width="120" height="80" rx="8" fill="#13131e" stroke="#4ade80" stroke-width="2"/>
  <text x="90" y="132" text-anchor="middle" fill="#4ade80" font-size="20">📱</text>
  <text x="90" y="158" text-anchor="middle" fill="#e8edf5" font-size="13" font-weight="500">Phone</text>
  <text x="90" y="174" text-anchor="middle" fill="#9aa8c9" font-size="11">Browser</text>

  <!-- Arrow 1 -->
  <line x1="150" y1="140" x2="195" y2="140" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="173" y="130" text-anchor="middle" fill="#4d5a7a" font-size="10">HTTPS</text>

  <!-- Tailscale -->
  <rect x="200" y="100" width="120" height="80" rx="8" fill="#13131e" stroke="#60a5fa" stroke-width="2"/>
  <text x="260" y="132" text-anchor="middle" fill="#60a5fa" font-size="20">🔒</text>
  <text x="260" y="158" text-anchor="middle" fill="#e8edf5" font-size="13" font-weight="500">Tailscale</text>
  <text x="260" y="174" text-anchor="middle" fill="#9aa8c9" font-size="11">Mesh VPN</text>

  <!-- Arrow 2 -->
  <line x1="320" y1="140" x2="365" y2="140" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="343" y="130" text-anchor="middle" fill="#4d5a7a" font-size="10">LAN</text>

  <!-- Cockpit -->
  <rect x="370" y="100" width="120" height="80" rx="8" fill="#13131e" stroke="#fbbf24" stroke-width="2"/>
  <text x="430" y="132" text-anchor="middle" fill="#fbbf24" font-size="20">🖥️</text>
  <text x="430" y="158" text-anchor="middle" fill="#e8edf5" font-size="13" font-weight="500">Cockpit</text>
  <text x="430" y="174" text-anchor="middle" fill="#9aa8c9" font-size="11">Web Terminal :3001</text>

  <!-- Arrow 3 -->
  <line x1="490" y1="140" x2="535" y2="140" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <text x="513" y="130" text-anchor="middle" fill="#4d5a7a" font-size="10">Shell</text>

  <!-- Claude Code -->
  <rect x="540" y="100" width="120" height="80" rx="8" fill="#13131e" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" fill="#4ade80" font-size="20">⚡</text>
  <text x="600" y="158" text-anchor="middle" fill="#e8edf5" font-size="13" font-weight="500">Claude Code</text>
  <text x="600" y="174" text-anchor="middle" fill="#9aa8c9" font-size="11">CLI Agent</text>

  <!-- Arrow 4 -->
  <line x1="660" y1="140" x2="700" y2="140" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="130" text-anchor="middle" fill="#4d5a7a" font-size="10">API</text>

  <!-- DeepSeek -->
  <rect x="705" y="100" width="80" height="80" rx="8" fill="#13131e" stroke="#818cf8" stroke-width="2"/>
  <text x="745" y="140" text-anchor="middle" fill="#818cf8" font-size="20">🧠</text>
  <text x="745" y="164" text-anchor="middle" fill="#e8edf5" font-size="11" font-weight="500">DeepSeek</text>

  <!-- Cost labels -->
  <text x="90" y="220" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">Free</text>
  <text x="260" y="220" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="500">Free</text>
  <text x="430" y="220" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="500">Free (OSS)</text>
  <text x="600" y="220" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="500">Free (CLI)</text>
  <text x="745" y="220" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="500">~$27/mo</text>

  <!-- Mini PC label -->
  <rect x="345" y="240" width="230" height="36" rx="6" fill="#1a1a2e" stroke="#2a2a42" stroke-width="1"/>
  <text x="460" y="263" text-anchor="middle" fill="#9aa8c9" font-size="12">🏠 Mini PC (24/7) · ~$2/mo electricity</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4ade80"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#fbbf24"/>
    </marker>
  </defs>
</svg>
